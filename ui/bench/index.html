<!doctype html>
<html lang="pt-BR" data-theme="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bancada de papéis de parede</title>
    <!-- Ferramenta de desenvolvimento (npm run dev -> /bench/): antes x depois, cenas x estilos e tempo de desenho.
         Fora do build do app (vite.config.ts so empacota index.html e mini.html). -->
    <style>
      body { margin: 0; padding: 16px; background: #0b0c0e; color: #e8e8e8; font: 13px system-ui, sans-serif; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .row { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; margin: 12px 0 22px; }
      figure { margin: 0; }
      figcaption { padding: 4px 2px; color: #a7a7a7; font-size: 12px; }
      .frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; }
      .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* maquete da interface por cima: barra lateral, titulo e caixa de pedido (para julgar legibilidade) */
      .ui { position: absolute; inset: 0; pointer-events: none; }
      .ui i { position: absolute; border-radius: 6px; background: #0a162466; border: 1px solid #ffffff2e; backdrop-filter: blur(3px); }
      .ui b { position: absolute; left: 50%; translate: -50% 0; top: 30%; font: 600 clamp(10px, 2.2vw, 26px) system-ui; color: #f2f5f8; text-shadow: 0 1px 2px #0008; white-space: nowrap; }
      table { border-collapse: collapse; margin-top: 8px; }
      td, th { padding: 3px 10px; border-bottom: 1px solid #ffffff1a; text-align: right; font-variant-numeric: tabular-nums; }
      th:first-child, td:first-child { text-align: left; }
    </style>
  </head>
  <body>
    <h1>Bancada de papéis de parede</h1>
    <p id="info"></p>
    <main id="out"></main>
    <script type="module" src="./bench.ts"></script>
  </body>
</html>
