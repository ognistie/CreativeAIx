[package]
name = "creative-aix-desktop"
version = "0.1.0"
description = "Creative AIx — casca Tauri da interface"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "creative_aix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Atualizacao automatica assinada: so no build de release com chave (ver docs/architecture/tauri-ui.md)
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
