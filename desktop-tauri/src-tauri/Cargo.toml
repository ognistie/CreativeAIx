[package]
name = "creative-aix-desktop"
version = "0.1.0"
description = "Creative AIx — casca Tauri da interface"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "creative_aix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
